[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peplab-bench"
version = "0.1.0"
description = "Transparent source-model-selector replay for peptide discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Oğuzcan Unver"}]
dependencies = []

[project.optional-dependencies]
models = ["numpy==1.26.4", "scipy==1.13.1", "xgboost==3.4.1"]

[project.scripts]
peplab-bench = "peplab_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
